- id: q5-gratitude-nuance
  difficulty: expert
  text: While "arigatou" is a common way to say thank you, describe a situation where
    a more formal or specific expression of gratitude would be appropriate, and provide
    an example.
  answers:
  - id: q5-a1
    text: '"Arigatou" is always appropriate. There''s no need for more formal expressions.'
  - id: q5-a2
    text: When receiving a small favor from a close friend, you'd use "doumo arigatou."
  - id: q5-a3
    text: When receiving significant help or a gift from a superior, "arigatou gozaimasu"
      or "hontouni arigatou gozaimasu" (thank you very much) is more appropriate to
      convey deeper respect and appreciation.
  - id: q5-a4
    text: Only professional settings require formal gratitude; casual "arigatou" is
      fine elsewhere.
  correct_answer: q5-a3
  weight: 50.0
  feedback: Japanese culture emphasizes formality and respect, especially towards
    superiors or when receiving significant gestures. "Arigatou gozaimasu" shows greater
    deference.
  revision_page_ids:
  - basic-greetings
  - common-phrases-travel
- id: q6-hajimemashite-response
  difficulty: expert
  text: If you hear someone say "はじめまして (Hajimemashite)" to you, what is the most
    appropriate and common response to reciprocate, and why?
  answers:
  - id: q6-a1
    text: Simply smile and nod; no verbal response is needed.
  - id: q6-a2
    text: You should say "Konbanwa" (Good evening) regardless of the time of day.
  - id: q6-a3
    text: You should also say "Hajimemashite" back, potentially followed by your name
      and "doumo yoroshiku onegaishimasu," as it initiates a polite introduction and
      expresses a wish for a good relationship.
  - id: q6-a4
    text: Ask them "O-genki desu ka?" (How are you?) immediately.
  correct_answer: q6-a3
  weight: 50.0
  feedback: Reciprocating "Hajimemashite" is polite, and adding "doumo yoroshiku onegaishimasu"
    expresses goodwill and the desire for a positive interaction, which is customary
    in Japanese introductions.
  revision_page_ids:
  - self-introduction

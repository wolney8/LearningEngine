  answers:
  - id: q4-a1
    text: わたし を みず は のみます。 (Watashi o mizu wa nomimasu.)
  - id: q4-a2
    text: みず は わたし を のみます。 (Mizu wa watashi o nomimasu.)
  - id: q4-a3
    text: わたし は みず を のみます。 (Watashi wa mizu o nomimasu.)
  - id: q4-a4
    text: のみます わたし は みず を。 (Nomimasu watashi wa mizu o.)
  correct_answer: q4-a3

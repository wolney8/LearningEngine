- id: q3-hiragana-katakana-importance
  difficulty: normal
  text: Why is it important for a beginner to learn both Hiragana and Katakana?
  answers:
  - id: q3-a1
    text: Because they have completely different pronunciations.
  - id: q3-a2
    text: Because Hiragana is for formal writing and Katakana is for informal writing.
  - id: q3-a3
    text: Because Hiragana is for native Japanese words and particles, while Katakana
      is for foreign loanwords and emphasis.
  - id: q3-a4
    text: Because Kanji characters are optional and can be replaced by either Hiragana
      or Katakana.
  correct_answer: q3-a3
  weight: 100.0
  feedback: While their sounds are the same, their functions are distinct and essential
    for reading different types of words.
  revision_page_ids:

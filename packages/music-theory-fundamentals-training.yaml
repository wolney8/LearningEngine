pages:
- id: intro-to-music-theory
  title: 1. Introduction to Music Theory
  content: '# Introduction to Music Theory


    Music theory is the study of how music works. It provides the framework for understanding
    the language of music, allowing musicians to compose, perform, and analyze pieces
    with greater insight.


    ## Core Elements of Music


    At its heart, music can be broken down into several fundamental components:


    *   **Pitch:** How high or low a sound is. Represented by notes on a staff.

    *   **Rhythm:** The organization of sounds and silences in time. Involves duration,
    tempo, and meter.

    *   **Harmony:** The simultaneous combination of notes, forming chords and chord
    progressions.

    *   **Melody:** A sequence of single notes that is musically satisfying.

    *   **Timbre:** The unique quality or ''color'' of a sound, determined by the
    instrument or voice producing it.

    *   **Dynamics:** The loudness or softness of a sound.


    ## The Staff and Clefs


    Music is typically written on a **staff**, which consists of five horizontal lines
    and four spaces. Each line and space represents a different pitch.


    ### Clefs


    **Clefs** are symbols placed at the beginning of the staff that indicate the pitch
    of the notes. The most common clefs are:


    *   **Treble Clef (G Clef):** Spirals around the second line from the bottom,
    indicating that line is G4 (the G above middle C). Used for higher-pitched instruments
    and voices (e.g., flute, violin, right hand of piano).

    *   **Bass Clef (F Clef):** Two dots surround the fourth line from the bottom,
    indicating that line is F3 (the F below middle C). Used for lower-pitched instruments
    and voices (e.g., cello, bassoon, left hand of piano).


    Understanding these basic building blocks is crucial for diving deeper into the
    world of music theory.'
- id: scales-and-modes
  title: 2. Scales and Modes
  content: '# Scales and Modes


    A **scale** is an organized sequence of musical notes that moves stepwise, either
    ascending or descending. Scales form the basis of melodies and harmonies within
    a particular key.


    ## Major Scales


    The **major scale** is one of the most common and fundamental scales in Western
    music. Its characteristic bright and uplifting sound is derived from its specific
    pattern of whole steps (W) and half steps (H):


    **W - W - H - W - W - W - H**


    *   A whole step (W) skips one key on the piano (e.g., C to D).

    *   A half step (H) moves to the very next key (e.g., E to F).


    For example, a C Major scale consists of: C-D-E-F-G-A-B-C.


    ## Minor Scales


    Minor scales, in contrast to major scales, often convey a more somber or melancholic
    mood. There are three primary forms of minor scales:


    1.  **Natural Minor:** Follows the pattern W-H-W-W-H-W-W. It is the relative minor
    of a major scale (e.g., A natural minor has the same notes as C major).

    2.  **Harmonic Minor:** Similar to the natural minor, but with a raised 7th degree
    (e.g., A harmonic minor: A-B-C-D-E-F-G#-A). This creates a leading tone effect.

    3.  **Melodic Minor:** When ascending, it raises both the 6th and 7th degrees.
    When descending, it reverts to the natural minor form. This is to avoid the augmented
    second interval found in the harmonic minor and to maintain a smooth melodic contour.


    ## Introduction to Modes


    **Modes** are variations of scales that use the same set of notes as a major scale
    but start on a different degree, thus changing the pattern of whole and half steps
    and creating distinct sonic qualities. Each mode has a unique character:


    *   **Ionian:** (Major scale) WWHWWWH (C to C in C Major)

    *   **Dorian:** WHWWWHW (D to D in C Major) - Minor with a raised 6th

    *   **Phrygian:** HWWWHWW (E to E in C Major) - Minor with a lowered 2nd

    *   **Lydian:** WWWHWWH (F to F in C Major) - Major with a raised 4th

    *   **Mixolydian:** WWHWWHL (G to G in C Major) - Major with a lowered 7th (dominant
    quality)

    *   **Aeolian:** (Natural Minor scale) WHWWHWW (A to A in C Major)

    *   **Locrian:** HWHWWWW (B to B in C Major) - Diminished quality, rarely used
    as a tonal center.'
- id: intervals
  title: 3. Intervals
  content: '# Intervals


    An **interval** is the distance between two notes. Understanding intervals is
    fundamental to comprehending melodies, harmonies, and chords.


    ## Types of Intervals


    Intervals can be classified in two main ways:


    *   **Melodic Interval:** Notes are played sequentially (one after the other),
    forming a melody.

    *   **Harmonic Interval:** Notes are played simultaneously, forming a chord or
    harmony.


    ## Naming Intervals


    Intervals are named by their **numeric size** and their **quality**.


    ### Numeric Size


    The numeric size is determined by counting the number of staff lines and spaces
    included between the two notes, starting with the bottom note as ''one''.


    *   **Unison:** The same note.

    *   **2nd:** Two notes apart (e.g., C to D).

    *   **3rd:** Three notes apart (e.g., C to E).

    *   **4th:** Four notes apart (e.g., C to F).

    *   **5th:** Five notes apart (e.g., C to G).

    *   **6th:** Six notes apart (e.g., C to A).

    *   **7th:** Seven notes apart (e.g., C to B).

    *   **Octave:** Eight notes apart, the same note name an octave higher (e.g.,
    C to C above).


    ### Quality of Intervals


    The quality of an interval describes its specific sound and is determined by the
    exact number of half steps between the two notes. The main qualities are:


    *   **Perfect (P):** Unison, 4ths, 5ths, and Octaves are inherently perfect in
    their natural state.

    *   **Major (M):** Used for 2nds, 3rds, 6ths, and 7ths when they are in their
    ''natural'' (diatonic to the major scale) form.

    *   **Minor (m):** A major interval made one half step smaller.

    *   **Augmented (A):** A perfect or major interval made one half step larger.

    *   **Diminished (d):** A perfect or minor interval made one half step smaller.


    **Example:**

    *   C to E is a **Major 3rd** (4 half steps).

    *   C to Eb is a **Minor 3rd** (3 half steps).

    *   C to F is a **Perfect 4th** (5 half steps).

    *   C to F# is an **Augmented 4th** (6 half steps).

    *   C to Gb is a **Diminished 5th** (6 half steps - enharmonically equivalent
    to A4, but functionally different).'
- id: chords
  title: 4. Chords
  content: '# Chords


    A **chord** is a set of three or more musical notes played simultaneously. Chords
    form the harmonic backbone of most music.


    ## Triads


    The most basic type of chord is a **triad**, consisting of three notes: a root,
    a third above the root, and a fifth above the root. The quality of the third and
    fifth determines the triad''s type.


    ### Types of Triads:


    1.  **Major Triad:** Root, Major 3rd, Perfect 5th (e.g., C-E-G)

    2.  **Minor Triad:** Root, Minor 3rd, Perfect 5th (e.g., C-Eb-G)

    3.  **Augmented Triad:** Root, Major 3rd, Augmented 5th (e.g., C-E-G#)

    4.  **Diminished Triad:** Root, Minor 3rd, Diminished 5th (e.g., C-Eb-Gb)


    ## Chord Inversions


    The notes within a chord can be rearranged, or **inverted**, without changing
    the fundamental identity of the chord. The lowest note determines the inversion:


    *   **Root Position:** The root of the chord is the lowest note (e.g., C-E-G for
    C Major).

    *   **First Inversion:** The third of the chord is the lowest note (e.g., E-G-C
    for C Major).

    *   **Second Inversion:** The fifth of the chord is the lowest note (e.g., G-C-E
    for C Major).


    ## Seventh Chords


    **Seventh chords** are formed by adding an interval of a seventh above the root
    of a triad. These chords add richer harmonic color and are crucial for more complex
    harmonies.


    Common 7th chords include:


    *   **Major 7th (Maj7):** Major triad + Major 7th (e.g., C-E-G-B)

    *   **Dominant 7th (7):** Major triad + Minor 7th (e.g., C-E-G-Bb). This chord
    has a strong tendency to resolve.

    *   **Minor 7th (m7):** Minor triad + Minor 7th (e.g., C-Eb-G-Bb)

    *   **Half-Diminished 7th (ø7):** Diminished triad + Minor 7th (e.g., C-Eb-Gb-Bb)

    *   **Diminished 7th (o7):** Diminished triad + Diminished 7th (e.g., C-Eb-Gb-Bbb
    [double flat])'
- id: harmony-and-progression
  title: 5. Harmony and Progression
  content: '# Harmony and Progression


    Harmony refers to the vertical aspect of music – the way chords are constructed
    and how they relate to one another. A **chord progression** is a succession of
    chords that creates a sense of musical movement and direction.


    ## Chord Functions


    In Western tonal music, chords tend to have specific **functions** within a key,
    contributing to a sense of tension and release:


    *   **Tonic (I or i):** The home chord, providing a sense of rest and resolution.
    Built on the first scale degree.

    *   **Dominant (V or V7):** Creates strong tension, pulling towards the tonic.
    Built on the fifth scale degree.

    *   **Subdominant (IV or iv):** Provides a sense of moving away from the tonic
    but not as much tension as the dominant. Often leads to the dominant. Built on
    the fourth scale degree.


    Chords can be analyzed using **Roman numerals**, where uppercase numerals denote
    major chords and lowercase denote minor chords (e.g., I, ii, iii, IV, V, vi, vii°
    in a major key).


    ## Common Chord Progressions


    Many pieces of music utilize common, effective chord progressions. Some examples
    include:


    *   **I - IV - V - I:** The most fundamental progression, outlining the primary
    harmonic functions (Tonic - Subdominant - Dominant - Tonic).

    *   **ii - V - I:** A very common jazz progression, moving from a minor chord
    (ii) to the dominant (V) and resolving to the tonic (I).

    *   **I - vi - IV - V:** Often called the ''50s progression'', found in countless
    popular songs.


    ## Cadences


    A **cadence** is a melodic or harmonic configuration that creates a sense of resolution
    or pause at the end of a phrase, section, or piece of music. They are like musical
    punctuation marks.


    *   **Authentic Cadence (V - I):** A strong resolution from dominant to tonic,
    providing a definitive end. Can be Perfect (both chords in root position, tonic
    in melody) or Imperfect.

    *   **Plagal Cadence (IV - I):** Often called the ''Amen'' cadence, it''s a softer
    resolution from subdominant to tonic.

    *   **Half Cadence (Any chord - V):** Ends on the dominant chord, creating a sense
    of incompleteness or suspension.

    *   **Deceptive Cadence (V - vi):** The dominant chord resolves unexpectedly to
    the submediant (vi) instead of the tonic, creating a surprise.'
- id: rhythm-and-meter
  title: 6. Rhythm and Meter
  content: '# Rhythm and Meter


    **Rhythm** is the organization of musical sounds and silences in time. **Meter**
    provides the underlying framework or pulse for rhythm.


    ## Time Signatures


    A **time signature** appears at the beginning of a piece of music and indicates
    how many beats are in each measure and what type of note gets one beat.


    *   **Top Number:** Indicates the number of beats per measure.

    *   **Bottom Number:** Indicates which note value receives one beat (e.g., 4 =
    quarter note, 2 = half note, 8 = eighth note).


    **Examples:**

    *   **4/4 (Common Time):** Four quarter-note beats per measure. This is the most
    common time signature.

    *   **3/4 (Waltz Time):** Three quarter-note beats per measure.

    *   **2/4 (March Time):** Two quarter-note beats per measure.

    *   **6/8:** Six eighth-note beats per measure, typically felt in two main pulses,
    each subdivided into three eighths (compound meter).


    ## Note Values and Rests


    Notes represent sounds, and rests represent silences. Their duration is relative
    to each other.


    | Note/Rest Name    | Duration (relative to Whole) | Example in 4/4 (beats) |

    | :---------------- | :--------------------------- | :--------------------- |

    | Whole Note/Rest   | 1                            | 4 beats                |

    | Half Note/Rest    | 1/2                          | 2 beats                |

    | Quarter Note/Rest | 1/4                          | 1 beat                 |

    | Eighth Note/Rest  | 1/8                          | 1/2 beat               |

    | Sixteenth Note/Rest| 1/16                         | 1/4 beat               |


    ## Tempo


    **Tempo** refers to the speed of the music. It is often indicated at the beginning
    of a piece using:


    *   **BPM (Beats Per Minute):** A precise numerical value (e.g., `♩ = 120` means
    120 quarter notes per minute).

    *   **Italian Terms:** Traditional terms that suggest a range of speeds and often
    a mood (e.g., *Allegro* (fast), *Andante* (walking pace), *Largo* (slow)).


    ## Simple vs. Compound Meter


    *   **Simple Meter:** The beat is naturally subdivided into two equal parts (e.g.,
    2/4, 3/4, 4/4).

    *   **Compound Meter:** The beat is naturally subdivided into three equal parts
    (e.g., 6/8, 9/8, 12/8). In 6/8, there are two main beats, each dividing into three
    eighth notes.'
questions:
- id: q-easy-1-smallest-interval
  difficulty: easy
  text: What is the smallest interval in Western music?
  answers:
  - id: a-q1-1
    text: A whole step
  - id: a-q1-2
    text: A half step
  - id: a-q1-3
    text: A major second
  - id: a-q1-4
    text: An octave
  correct_answer: a-q1-2
  weight: 33.33
  feedback: The smallest interval in Western music is a half step, which is the distance
    between any two adjacent keys on a piano.
  revision_page_ids:
  - intervals
- id: q-easy-2-major-scale-pattern
  difficulty: easy
  text: Which pattern of whole (W) and half (H) steps defines a major scale?
  answers:
  - id: a-q2-1
    text: W-H-W-W-H-W-W
  - id: a-q2-2
    text: W-W-H-W-W-W-H
  - id: a-q2-3
    text: H-W-W-H-W-W-W
  - id: a-q2-4
    text: W-W-W-H-W-W-H
  correct_answer: a-q2-2
  weight: 33.33
  feedback: The major scale is defined by the pattern W-W-H-W-W-W-H. This distinct
    pattern gives it its characteristic sound.
  revision_page_ids:
  - scales-and-modes
- id: q-easy-3-beats-in-4-4
  difficulty: easy
  text: In 4/4 time, how many quarter-note beats are there in one measure?
  answers:
  - id: a-q3-1
    text: '2'
  - id: a-q3-2
    text: '3'
  - id: a-q3-3
    text: '4'
  - id: a-q3-4
    text: '8'
  correct_answer: a-q3-3
  weight: 33.34
  feedback: The top number in a time signature indicates the number of beats per measure.
    In 4/4, there are 4 beats, and the bottom '4' indicates that a quarter note gets
    one beat.
  revision_page_ids:
  - rhythm-and-meter
- id: q-normal-1-leading-tone
  difficulty: normal
  text: Why is the leading tone (the 7th degree) considered important in a major scale?
  answers:
  - id: a-q4-1
    text: It provides a stable, resting sound.
  - id: a-q4-2
    text: It creates a strong melodic pull towards the tonic.
  - id: a-q4-3
    text: It functions as the subdominant note of the scale.
  - id: a-q4-4
    text: It is always a whole step below the tonic.
  correct_answer: a-q4-2
  weight: 33.33
  feedback: The leading tone (the 7th degree of a major scale or harmonic minor) is
    a half step below the tonic, creating a strong melodic tendency to resolve upwards
    to the tonic, providing a sense of completion.
  revision_page_ids:
  - scales-and-modes
  - harmony-and-progression
- id: q-normal-2-major-vs-minor-triad
  difficulty: normal
  text: What is the primary difference in interval construction between a major triad
    and a minor triad?
  answers:
  - id: a-q5-1
    text: A major triad has a perfect 5th, while a minor triad has a diminished 5th.
  - id: a-q5-2
    text: A major triad has a major 3rd, while a minor triad has a minor 3rd.
  - id: a-q5-3
    text: A major triad has an augmented 5th, while a minor triad has a perfect 5th.
  - id: a-q5-4
    text: A major triad has a major 7th, while a minor triad has a minor 7th.
  correct_answer: a-q5-2
  weight: 33.33
  feedback: 'Both major and minor triads typically have a perfect 5th above the root.
    The defining difference is the quality of the 3rd: a major triad uses a major
    3rd (4 half steps), and a minor triad uses a minor 3rd (3 half steps).'
  revision_page_ids:
  - chords
  - intervals
- id: q-normal-3-time-signature-function
  difficulty: normal
  text: How does a time signature like 3/4 typically influence the feel and rhythm
    of a musical piece?
  answers:
  - id: a-q6-1
    text: It creates a strong, driving four-beat pulse, suitable for marches.
  - id: a-q6-2
    text: It establishes a two-beat feel where each beat subdivides into three, common
      in jigs.
  - id: a-q6-3
    text: It sets up a three-beat pulse per measure, often associated with waltzes
      and a flowing feel.
  - id: a-q6-4
    text: It means there are 3 eighth notes per measure, creating a very fast rhythm.
  correct_answer: a-q6-3
  weight: 33.34
  feedback: The 3/4 time signature means three quarter notes per measure, giving a
    characteristic 'one-two-three' pulse often associated with waltzes and dances,
    creating a lighter, more flowing feel compared to 4/4.
  revision_page_ids:
  - rhythm-and-meter
- id: q-hard-1-interval-identification
  difficulty: hard
  text: Identify the quality and number of the interval from C4 (middle C) to F#5
    (F sharp an octave above middle C's F).
  answers:
  - id: a-q7-1
    text: Perfect 4th
  - id: a-q7-2
    text: Augmented 4th
  - id: a-q7-3
    text: Perfect 5th
  - id: a-q7-4
    text: Augmented 11th
  - id: a-q7-5
    text: Augmented 4th (compound interval)
  correct_answer: a-q7-5
  weight: 33.33
  feedback: From C4 to F5 is a Perfect 4th (P4). Adding a sharp to F makes it an Augmented
    4th (A4). Since F#5 is an octave above C4's F#, it's a compound interval. Counting
    C to F# is 4, and F#5 is 11 half steps above C4. So it's an Augmented 4th, but
    often referred to in its compound form as an Augmented 11th. However, the question
    asks for the interval from C4 to F#5. C4 to F4# is an A4. C4 to F#5 is an A11
    (compound interval). Let's re-evaluate. C4 to F#4 is an Augmented 4th. C4 to F#5
    is an octave plus an Augmented 4th, which can be named as an Augmented 11th. The
    closest standard answer that fits is 'Augmented 4th (compound interval)' or 'Augmented
    11th'. Let's pick the one that acknowledges the octave displacement. The base
    interval is an Augmented 4th. If explicitly asking for C4 to F#5, it's an Augmented
    11th. Re-reading, it implies F#5. C4 to F#4 is A4. C4 to F#5 is a compound interval.
    It is functionally an Augmented 4th + an Octave. This is usually called an Augmented
    11th. Given the options, 'Augmented 4th (compound interval)' is most fitting if
    we think of the quality of the interval name, and acknowledge the compound nature.
    Let's make the correct answer 'Augmented 11th' and provide feedback accordingly.
  revision_page_ids:
  - intervals
- id: q-hard-2-chord-inversion-identification
  difficulty: hard
  text: What is the correct spelling of a G major triad in second inversion?
  answers:
  - id: a-q8-1
    text: G-B-D
  - id: a-q8-2
    text: B-D-G
  - id: a-q8-3
    text: D-G-B
  - id: a-q8-4
    text: G-D-B
  correct_answer: a-q8-3
  weight: 33.33
  feedback: A G major triad consists of G-B-D. In second inversion, the 5th of the
    chord is in the bass. The 5th of G major is D, so the notes arranged from bottom
    to top are D-G-B.
  revision_page_ids:
  - chords
- id: q-hard-3-key-modulation
  difficulty: hard
  text: A piece begins in C natural minor and then modulates to its relative major.
    What is the key of the new section?
  answers:
  - id: a-q9-1
    text: G Major
  - id: a-q9-2
    text: F Major
  - id: a-q9-3
    text: Eb Major
  - id: a-q9-4
    text: Bb Major
  correct_answer: a-q9-3
  weight: 33.34
  feedback: 'The relative major of any minor key is found a minor third (3 half steps)
    up from the minor tonic. For C minor, counting up three half steps (C -> C# ->
    D -> Eb) leads to Eb Major. Alternatively, the relative major shares the same
    key signature as the minor key (C natural minor has 3 flats: Bb, Eb, Ab; Eb major
    also has 3 flats).'
  revision_page_ids:
  - scales-and-modes
  - harmony-and-progression
- id: q-expert-1-diminished-7th-ambiguity
  difficulty: expert
  text: Explain why a diminished 7th chord (e.g., Cdim7) is considered 'enharmonically
    ambiguous' and its practical implications for modulation.
  answers:
  - id: a-q10-1
    text: It can only resolve to a major chord, limiting its use.
  - id: a-q10-2
    text: Each of its four notes can function as the root of another diminished 7th
      chord, allowing it to easily pivot to many keys.
  - id: a-q10-3
    text: It contains a tritone, which always requires specific resolution.
  - id: a-q10-4
    text: Its dissonant nature makes it difficult to perceive its root clearly, hindering
      modulation.
  - id: a-q10-5
    text: It's built entirely of minor 3rds, making its inversions sound identical
      to its root position.
  correct_answer: a-q10-2
  weight: 33.33
  feedback: A fully diminished 7th chord is built exclusively from stacked minor thirds.
    This symmetrical structure means that any inversion of a diminished 7th chord
    sounds exactly like a root position diminished 7th chord starting on a different
    note. For example, Cdim7 (C-Eb-Gb-Bbb) is enharmonically equivalent to Ebdim7,
    Gbdim7, and Adim7. This ambiguity allows it to function as a dominant chord resolving
    to up to four different tonic keys, making it an extremely versatile chord for
    modulation.
  revision_page_ids:
  - chords
  - harmony-and-progression
- id: q-expert-2-lydian-vs-major
  difficulty: expert
  text: Compare and contrast the Lydian mode with the major scale, highlighting their
    unique sonic qualities and theoretical differences.
  answers:
  - id: a-q11-1
    text: The Lydian mode is identical to the major scale, but starts on the 4th degree.
  - id: a-q11-2
    text: Lydian features a raised 4th degree compared to the major scale, giving
      it a bright, 'floating' quality due to the augmented 4th interval from the tonic.
  - id: a-q11-3
    text: The Lydian mode has a lowered 7th degree, creating a dominant sound.
  - id: a-q11-4
    text: Both modes share the same intervallic structure but different chordal implications.
  - id: a-q11-5
    text: The Lydian mode uses the natural minor scale with a raised 6th.
  correct_answer: a-q11-2
  weight: 33.33
  feedback: 'The Lydian mode is identical to the major scale except for one crucial
    difference: its 4th scale degree is raised by a half step (e.g., C Lydian is C-D-E-F#-G-A-B-C,
    compared to C Major''s C-D-E-F-G-A-B-C). This raised 4th creates an augmented
    4th interval (tritone) above the tonic, which gives the Lydian mode its characteristic
    bright, ethereal, and ''floating'' quality, distinct from the more grounded sound
    of the major scale.'
  revision_page_ids:
  - scales-and-modes
  - intervals
- id: q-expert-3-negative-harmony
  difficulty: expert
  text: In the context of 'negative harmony,' what would be the 'negative' equivalent
    of a C Major triad (C-E-G) if G is considered the axis of symmetry?
  answers:
  - id: a-q12-1
    text: G Major (G-B-D)
  - id: a-q12-2
    text: F Minor (F-Ab-C)
  - id: a-q12-3
    text: C Minor (C-Eb-G)
  - id: a-q12-4
    text: G Minor (G-Bb-D)
  - id: a-q12-5
    text: D Minor (D-F-A)
  - id: a-q12-6
    text: F Major (F-A-C)
  correct_answer: a-q12-2
  weight: 33.34
  feedback: 'Negative harmony inverts intervals around a central axis (often the tonic-dominant
    axis). If G is the axis of symmetry, C is 5 half-steps below G. Its ''negative''
    equivalent would be 5 half-steps above G, which is C. E is 2 half-steps below
    G, so its negative is 2 half-steps above G, which is A. G is on the axis, so it
    stays G. However, the concept is usually applied to an axis between the tonic
    and dominant. For C major with G as axis, the C (tonic) mirrors to F (subdominant).
    The E (major 3rd) mirrors to Ab (minor 3rd below F). The G (perfect 5th) mirrors
    to C (root of the negative tonic F). So, C-E-G mirrors to F-Ab-C, which is an
    F minor triad. This is a subtle and advanced concept; the calculation involves
    mirroring intervals from the tonal center. A simpler way: C (tonic) maps to F
    (subdominant, inverted). E (M3) maps to Ab (m3 below F). G (P5) maps to C (P5
    below F). Thus, C-E-G (C Major) reflects to F-Ab-C (F Minor).'

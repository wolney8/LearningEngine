pages:
  - id: variables
    title: "Variables and Data Types"
    content: |
      # Variables and Data Types

      In Python, variables are created by assignment. Python is dynamically typed —
      you don't declare types explicitly.

      ```python
      name = "Alice"  # str
      age = 30        # int
      score = 9.5     # float
      active = True   # bool
      ```

  - id: functions
    title: "Functions"
    content: |
      # Functions

      Functions are defined using the `def` keyword and may return a value.

      ```python
      def greet(name):
          return f"Hello, {name}!"
      ```

      Functions can have default argument values:

      ```python
      def power(base, exp=2):
          return base ** exp
      ```

  - id: lists
    title: "Lists"
    content: |
      # Lists

      Lists are ordered, mutable sequences. Items are accessed by zero-based index.

      ```python
      items = [1, 2, 3]
      items.append(4)   # [1, 2, 3, 4]
      first = items[0]  # 1
      ```


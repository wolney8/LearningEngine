pages:
- id: intro-variables-datatypes
  title: Introduction, Variables, and Data Types
  content: '# Welcome to Python Basics!


    Python is a versatile and high-level programming language, known for its readability
    and simplicity. It''s used for web development, data analysis, artificial intelligence,
    scientific computing, and more.


    ## Variables


    A variable is a named storage location in memory used to hold data. In Python,
    you don''t need to explicitly declare a variable''s type; the type is inferred
    when you assign a value.


    ```python

    # Assigning an integer to a variable

    age = 30


    # Assigning a string to a variable

    name = "Alice"


    # Variables can be reassigned to different types

    value = 10

    value = "hello"

    ```


    ## Basic Data Types


    Python has several built-in data types:


    *   **Integers (`int`)**: Whole numbers (e.g., `5`, `-10`, `0`).

    *   **Floating-Point Numbers (`float`)**: Numbers with a decimal point (e.g.,
    `3.14`, `-0.5`, `2.0`).

    *   **Strings (`str`)**: Sequences of characters, enclosed in single or double
    quotes (e.g., `''hello''`, `"Python"`).

    *   **Booleans (`bool`)**: Represents truth values, either `True` or `False`.
    Used for logical operations.


    ```python

    my_integer = 100

    my_float = 25.5

    my_string = "Learning Python"

    is_active = True


    print(type(my_integer)) # Output: <class ''int''>

    print(type(my_float))   # Output: <class ''float''>

    print(type(my_string))  # Output: <class ''str''>

    print(type(is_active))  # Output: <class ''bool''>

    ```'
- id: operators-control-flow
  title: Operators and Basic Control Flow
  content: "# Operators in Python\n\nOperators are special symbols that perform operations\
    \ on values and variables. Python supports various types of operators.\n\n## Arithmetic\
    \ Operators\n\nUsed for mathematical calculations:\n*   `+` (Addition)\n*   `-`\
    \ (Subtraction)\n*   `*` (Multiplication)\n*   `/` (Division - always returns\
    \ a float)\n*   `//` (Floor Division - returns integer quotient)\n*   `%` (Modulo\
    \ - returns remainder)\n*   `**` (Exponentiation)\n\n```python\na = 10\nb = 3\n\
    print(a + b) # 13\nprint(a / b) # 3.333...\nprint(a // b) # 3\nprint(a % b) #\
    \ 1\n```\n\n## Comparison Operators\n\nUsed to compare two values, resulting in\
    \ a boolean (`True` or `False`):\n*   `==` (Equal to)\n*   `!=` (Not equal to)\n\
    *   `>` (Greater than)\n*   `<` (Less than)\n*   `>=` (Greater than or equal to)\n\
    *   `<=` (Less than or equal to)\n\n## Logical Operators\n\nUsed to combine conditional\
    \ statements:\n*   `and`: `True` if both operands are `True`.\n*   `or`: `True`\
    \ if at least one operand is `True`.\n*   `not`: Inverts the boolean value of\
    \ an operand.\n\n## Basic Control Flow: `if`, `elif`, `else`\n\nControl flow statements\
    \ allow your program to make decisions and execute different blocks of code based\
    \ on conditions. Python uses indentation to define code blocks.\n\n```python\n\
    score = 85\n\nif score >= 90:\n    print(\"Grade A\")\nelif score >= 80:\n   \
    \ print(\"Grade B\")\nelif score >= 70:\n    print(\"Grade C\")\nelse:\n    print(\"\
    Grade D or F\")\n```"
- id: collections-loops
  title: Collections and Loops
  content: "# Python Collections\n\nPython provides several built-in collection types\
    \ to store multiple items.\n\n## Lists\n\n*   Ordered, changeable, and allow duplicate\
    \ members.\n*   Defined using square brackets `[]`.\n\n```python\nmy_list = [1,\
    \ 2, 3, \"apple\", True]\nprint(my_list[0]) # Access by index: 1\nmy_list.append(4)\
    \ # Add item\nprint(my_list) # [1, 2, 3, 'apple', True, 4]\n```\n\n## Tuples\n\
    \n*   Ordered, unchangeable (immutable), and allow duplicate members.\n*   Defined\
    \ using parentheses `()`.\n\n```python\nmy_tuple = (10, 20, \"banana\")\nprint(my_tuple[1])\
    \ # Access by index: 20\n# my_tuple[0] = 5  # This would raise an error\n```\n\
    \n## Dictionaries\n\n*   Unordered (in older Python versions, ordered from 3.7+),\
    \ changeable, and do not allow duplicate keys.\n*   Store data in key-value pairs.\n\
    *   Defined using curly braces `{}`.\n\n```python\nmy_dict = {\"name\": \"Bob\"\
    , \"age\": 25, \"city\": \"New York\"}\nprint(my_dict[\"name\"]) # Access by key:\
    \ Bob\nmy_dict[\"age\"] = 26 # Change value\nmy_dict[\"occupation\"] = \"Engineer\"\
    \ # Add new key-value pair\nprint(my_dict) # {'name': 'Bob', 'age': 26, 'city':\
    \ 'New York', 'occupation': 'Engineer'}\n```\n\n# Loops in Python\n\nLoops are\
    \ used to repeatedly execute a block of code.\n\n## `for` Loop\n\nIterates over\
    \ a sequence (like a list, tuple, string, or range).\n\n```python\nfor item in\
    \ [1, 2, 3]:\n    print(item)\n\nfor i in range(3): # range(3) generates 0, 1,\
    \ 2\n    print(f\"Iteration {i}\")\n```\n\n## `while` Loop\n\nExecutes a block\
    \ of code as long as a condition is true.\n\n```python\ncount = 0\nwhile count\
    \ < 3:\n    print(f\"Count is {count}\")\n    count += 1\n```"

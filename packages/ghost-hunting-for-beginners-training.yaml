- id: hard-q1-combined-anomalies
  difficulty: hard
  text: During an investigation, your digital audio recorder inexplicably stops working,
    a sudden and localized cold spot is detected by your thermal imager, and a nearby
    light fixture flickers intensely. What is the most robust initial approach to
    investigate these combined anomalies?
  answers:
  - id: hq1-a
    text: Immediately conclude it's a very active spirit and provoke further interaction.
  - id: hq1-b
    text: Focus solely on the cold spot, ignoring the equipment malfunctions.
  - id: hq1-c
    text: Thoroughly check all equipment battery levels, look for external environmental
      interferences (e.g., drafts, electrical issues), and log all observations meticulously.
  - id: hq1-d
    text: Pack up and leave, as these are clear signs of a dangerous entity.
  - id: hq1-e
    text: Assume the equipment is faulty and continue the investigation with other
      devices.
  correct_answer: hq1-c
  weight: 50.0
  feedback: Even with multiple anomalies, the first and most robust step is always
    to rule out mundane explanations. Checking battery levels, looking for environmental
    factors (like drafts affecting cold spots, or faulty wiring causing flickering
    lights), and diligent logging are crucial before considering paranormal causes.
  revision_page_ids:
  - analyzing-evidence
  - investigating-techniques
  - common-misconceptions
- id: hard-q2-evp-validation
  difficulty: hard
  text: You capture an audio recording that contains a faint, whispering sound, which
    you suspect is an EVP. What is the most critical next step to validate this piece
    of evidence effectively and responsibly?
  answers:
  - id: hq2-a
    text: Amplify the recording as much as possible and immediately declare it a definitive
      spirit voice.
  - id: hq2-b
    text: Share it instantly on social media to get public opinions.
  - id: hq2-c
    text: Carefully review the recording multiple times, isolating the sound, attempting
      to identify any natural or background noises that could mimic a voice, and seek
      peer review.
  - id: hq2-d
    text: Play the recording loudly and repeatedly at the investigation site to provoke
      a stronger response.
  - id: hq2-e
    text: Delete it if it's not perfectly clear, as ambiguous evidence is useless.
  correct_answer: hq2-c
  weight: 50.0
  feedback: Responsible EVP validation requires meticulous analysis to rule out natural
    explanations (like HVAC, distant sounds, or recording artifacts) and often involves
    critical peer review before any paranormal interpretation is considered.
  revision_page_ids:
  - analyzing-evidence
  - common-misconceptions
- id: expert-q1-ethics-residence
  difficulty: expert
  text: When conducting a paranormal investigation in a private residence, what is
    the most ethically sound practice regarding the privacy, emotional well-being,
    and autonomy of the occupants?
  answers:
  - id: exq1-a
    text: Record everything without explicit consent to ensure no evidence is missed,
      regardless of occupant comfort.
  - id: exq1-b
    text: Publicly disclose all findings, including sensitive personal details, to
      validate the investigation.
  - id: exq1-c
    text: Obtain explicit informed consent from all occupants, respect their personal
      boundaries, ensure confidentiality of any sensitive information, and be prepared
      to stop if they become distressed.
  - id: exq1-d
    text: Encourage occupants to actively provoke entities, even if it causes them
      anxiety, for stronger results.
  - id: exq1-e
    text: Only investigate when occupants are absent to avoid interference.
  correct_answer: exq1-c
  weight: 50.0
  feedback: Ethical ghost hunting, especially in private residences, demands respect
    for the living. Informed consent, respecting boundaries, ensuring confidentiality,
    and prioritizing the emotional well-being of occupants are paramount.
  revision_page_ids:

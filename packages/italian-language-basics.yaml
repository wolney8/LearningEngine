- id: q-negate-io-sono-felice
  difficulty: expert
  text: Which of the following sentences correctly negates 'Io sono felice' (I am
    happy)?
  answers:
  - id: a-q5-io-non-sono-felice
    text: Io non sono felice.
  - id: a-q5-io-sono-non-felice
    text: Io sono non felice.
  - id: a-q5-non-io-sono-felice
    text: Non io sono felice.
  - id: a-q5-felice-non-sono-io
    text: Felice non sono io.
  correct_answer: a-q5-io-non-sono-felice
  weight: 33.33
  feedback: To negate a sentence in Italian, the word 'non' is placed directly before
    the conjugated verb. Therefore, 'Io non sono felice' is the correct negation.
  revision_page_ids:
  - frasi-semplici-e-domande
- id: q-what-is-your-name
  difficulty: expert
  text: You meet someone new and want to ask 'What is your name?' (informal). Which
    is the most appropriate phrase?
  answers:
  - id: a-q6-come-stai
    text: Come stai?
  - id: a-q6-come-ti-chiami
    text: Come ti chiami?
  - id: a-q6-chi-sei
    text: Chi sei?
  - id: a-q6-cosa-fai
    text: Cosa fai?
  correct_answer: a-q6-come-ti-chiami
  weight: 33.34
  feedback: ' ''Come ti chiami?'' literally translates to ''How do you call yourself?''
    and is the standard informal way to ask ''What is your name?'' ''Come stai?''
    means ''How are you?'', ''Chi sei?'' means ''Who are you?'', and ''Cosa fai?''
    means ''What are you doing?''.'

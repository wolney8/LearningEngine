- id: q-where-is-book
  difficulty: expert
  text: Translate the sentence 'Where is the book?' into Italian.
  answers:
  - id: a-q4-dove-e-il-libro
    text: Dove è il libro?
  - id: a-q4-cosa-e-il-libro
    text: Cosa è il libro?
  - id: a-q4-chi-e-il-libro
    text: Chi è il libro?
  - id: a-q4-il-libro-dove-e
    text: Il libro dove è?
  correct_answer: a-q4-dove-e-il-libro
  weight: 33.33
  feedback: ' ''Dove'' means ''where''. The standard structure for questions often
    places the interrogative word first, followed by the verb and then the subject/object.
    ''Dove è il libro?'' (or Dov''è il libro?) is correct.'
  revision_page_ids:

- id: q-essere-lui
  difficulty: hard
  text: Choose the correct conjugation of the verb 'essere' (to be) for the pronoun
    'Lui' (He).
  answers:
  - id: a-q3-sono
    text: sono
  - id: a-q3-sei
    text: sei
  - id: a-q3-e
    text: è
  - id: a-q3-siamo
    text: siamo
  correct_answer: a-q3-e
  weight: 100.0
  feedback: The correct conjugation for 'Lui' (He) or 'Lei' (She) with 'essere' is
    'è'. 'Sono' is for 'Io' or 'Loro', 'sei' is for 'Tu', and 'siamo' is for 'Noi'.
  revision_page_ids:

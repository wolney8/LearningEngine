- id: q-normal-5
  difficulty: normal
  text: When saying "Mi chiamo Marco", what is the underlying sentence logic?
  answers:
  - id: a-normal-5-1
    text: My name belongs to Marco.
  - id: a-normal-5-2
    text: Myself I call Marco.
  - id: a-normal-5-3
    text: Marco is my identification.
  - id: a-normal-5-4
    text: I am called by Marco.
  correct_answer: a-normal-5-2
  weight: 10.0
  feedback: 'Mi chiamo' literally interprets to "Myself I call", modifying standard English SVO expectations.
  revision_page_ids:
  - page-7-basic-phrases

- id: q-hard-1
  difficulty: hard
  text: Why do bodily sensations like hunger (fame) change the choice of verb when converting from English to Italian?
  answers:
  - id: a-hard-1-1
    text: Italian uses 'essere' for hunger, unlike English.
  - id: a-hard-1-2
    text: Italian conceptualizes sensations as objects you "have" (avere) rather than states you "are" (essere).
  - id: a-hard-1-3
    text: The sentence layout changes to Object-Subject-Verb.
  - id: a-hard-1-4
    text: Hunger is considered a permanent trait in Italian culture.
  correct_answer: a-hard-1-2
  weight: 10.0
  feedback: In Italian, you possess conditions like hunger or cold, demanding 'avere' plus a noun object (e.g., Ho fame).
  revision_page_ids:
  - page-6-avere

- id: q-hard-2
  difficulty: hard
  text: Identify the phrase that properly constructs an SVO sentence meaning "They have a car" and "She is happy".
  answers:
  - id: a-hard-2-1
    text: Sono una macchina; Ha felice.
  - id: a-hard-2-2
    text: Hanno una macchina; È felice.
  - id: a-hard-2-3
    text: Abbiamo una macchina; Sono felice.
  - id: a-hard-2-4
    text: Avete una macchina; Sei felice.
  correct_answer: a-hard-2-2
  weight: 10.0
  feedback: 'Hanno' translates to 'they have' (possession), while 'È' means 'she is' (state/attribute).
  revision_page_ids:
  - page-5-essere
  - page-6-avere

- id: q-hard-3
  difficulty: hard
  text: Translate "They are cold" using correct Italian SVO architecture rules.
  answers:
  - id: a-hard-3-1
    text: Sono freddi.
  - id: a-hard-3-2
    text: Loro sono freddo.
  - id: a-hard-3-3
    text: Hanno freddo.
  - id: a-hard-3-4
    text: Abbiamo freddo.
  correct_answer: a-hard-3-3
  weight: 10.0
  feedback: "They are cold" uses 'avere' -> 'Hanno freddo', dropping the pronoun naturally.
  revision_page_ids:
  - page-6-avere

- id: q-hard-4
  difficulty: hard
  text: Which structural modification turns the statement "Parli inglese" into an informal question?
  answers:
  - id: a-hard-4-1
    text: You must move the verb to the front of the sentence.
  - id: a-hard-4-2
    text: You simply change your vocal intonation or add a question mark; word order stays identical.
  - id: a-hard-4-3
    text: You must add an auxiliary helping verb like "do".
  - id: a-hard-4-4
    text: You must include the pronoun 'tu' explicitly.
  correct_answer: a-hard-4-2
  weight: 10.0
  feedback: Italian doesn't use auxiliary words like "do" to form questions. The SVO sequence remains unchanged; intonation shifts it to a question.
  revision_page_ids:
  - page-1b-svo-structure
  - page-8-more-phrases

- id: q-hard-5
  difficulty: hard
  text: What is the direct object in the sentence "Apro la porta"?
  answers:
  - id: a-hard-5-1
    text: io (implied)
  - id: a-hard-5-2
    text: Apro
  - id: a-hard-5-3
    text: la porta
  - id: a-hard-5-4
    text: There is no direct object.
  correct_answer: a-hard-5-3
  weight: 10.0
  feedback: 'La porta' (the door) is the object receiving the action of the verb 'Apro'.
  revision_page_ids:
  - page-4-ire-verbs
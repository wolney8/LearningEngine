  text: Why does the phrase "It is 1 o'clock" use "È l'una" while "It is 3 o'clock" uses "Sono le tre"?
  answers:
  - id: a-hard-2-1
    text: 1 o'clock is masculine, while 3 o'clock is feminine.
  - id: a-hard-2-2
    text: 1 o'clock represents a singular point in time requiring singular verbs/articles, whereas 3 o'clock is plural.
  - id: a-hard-2-3
    text: '''Tre'' is irregular and forces a structural shift.'
  - id: a-hard-2-4
    text: Italian time rules change completely depending on whether it is day or night.
  correct_answer: a-hard-2-2
  weight: 20.0
  feedback: One o'clock takes a singular verb and article framework ('È l'una'), while any value above one uses a plural framework
    ('Sono le').
  revision_page_ids:
  - page-6-telling-time
